[package]
name = "graph"
version = "0.1.0"
edition = "2021"

[dependencies]
oxc_allocator = "0.13"
oxc_parser = "0.13"
oxc_ast = "0.13"
oxc_span = "0.13"
oxc_resolver = "1.11.1"
walkdir = "2.5"
notify = "6.1"
clap = { version = "4.5", features = ["derive"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.37", features = ["full"] }
rust-embed = "8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.1"
petgraph = "0.6"
mime_guess = "2.0.5"
tower-http = { version = "0.6.8", features = ["full"] }
ignore = "0.4.25"
